// What the LED on the robot's back shows (K1 only). Colours are explained in Docs/leds.md.
mode = automatic; // automatic: "match" in Release builds, "test" otherwise. Force with match or test.
ballLostTime = 3000; // [ms] test mode: blue flash while playing if the robot has not seen the ball for this long
lowBatteryLevel = 25; // [%] test mode: red flash if the battery is below this level (or a joint is very hot)
blipPeriod = 2000; // [ms] test mode: each kind of flash appears once per period
blipDuration = 200; // [ms] test mode: length of one flash
